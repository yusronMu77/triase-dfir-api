[project]
name = "astria-api"
version = "0.1.0"
description = "BFF /api/v1 untuk web: sesi, peran, agregasi."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "astria-common[otel]",
    "astria-contracts",
    "fastapi>=0.162.2,<1",
    "httpx>=0.28.1,<1",
    "pydantic>=2.14.3,<3",
    "orjson>=3.13.0",
]

[project.scripts]
astria-api = "astria_api.__main__:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "anyio>=4.11",
    "hypothesis>=6.170,<7",
    "ruff==0.17.4",
]

# Dependensi privat lewat tag git (keputusan pemilik infra#3). Naikkan tag di sini, lalu `uv lock`.
[tool.uv.sources]
astria-common = { git = "https://github.com/yusronMu77/triase-dfir-common", tag = "v0.2.0" }
astria-contracts = { git = "https://github.com/yusronMu77/triase-dfir-contracts", tag = "v0.1.0" }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astria_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "W", "ASYNC"]
ignore = ["S101", "S104", "ASYNC109"]

[tool.ruff.lint.isort]
known-first-party = ["astria_api"]
